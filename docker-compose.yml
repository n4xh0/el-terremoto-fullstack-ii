name: terremoto
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: terremoto
      MYSQL_USER: terremoto
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./backend-spring
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: terremoto
      DB_NAME: terremoto
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:?Configura CORS_ORIGINS}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:3000"
volumes:
  mysql_data:
